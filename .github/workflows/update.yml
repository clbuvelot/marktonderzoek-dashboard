name: Update TenderNed Dataset

concurrency:
  group: tenderned-dataset
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      gunningen_vanaf:
        description: 'Inhaalslag gunningen vanaf (JJJJ-MM-DD). Leeg = standaard 30 dagen terug.'
        required: false
        default: ''
  schedule:
    - cron: '0 6 * * *'    # elke dag om 06:00 UTC

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 90

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Dependencies installeren
        run: pip install -r requirements.txt

      - name: Pipeline testen
        run: python -m unittest discover -s tests -v

      - name: Node instellen voor dashboardtests
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Dashboardselecties testen
        run: node --test tests/dashboard_core.test.cjs

      - name: Pipeline uitvoeren
        env:
          AZURE_FOUNDRY_API_KEY: ${{ secrets.AZURE_FOUNDRY_API_KEY }}
          GUNNINGEN_VANAF: ${{ inputs.gunningen_vanaf }}
        run: |
          if [ -n "$GUNNINGEN_VANAF" ]; then
            python update.py --gunningen-vanaf "$GUNNINGEN_VANAF"
          else
            python update.py
          fi

      - name: Winnaars aanvullen uit bulk Excel
        run: |
          # De winnaarsnaam staat niet in de TNS API, alleen in de bulk Excel.
          # De bulk wordt periodiek ververst; wekelijks controleren volstaat.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%u)" = "1" ]; then
            python vul_winnaars_aan.py
          else
            echo "Winnaars worden op maandag en bij handmatige runs aangevuld."
          fi

      - name: Rapporten vernieuwen en dataset controleren
        run: |
          python analyse.py
          python controleer.py

      - name: Controleer op wijzigingen
        id: check
        run: |
          git add data/
          git diff --cached --quiet && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit en push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "data: dagelijkse update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: Geen wijzigingen
        if: steps.check.outputs.changed == 'false'
        run: echo "Geen nieuwe publicaties, niets gecommit."
